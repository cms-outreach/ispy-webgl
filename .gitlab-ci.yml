stages:
  - build
  - deploy

build:
  stage: build
  image: node:lts
  script:
    - npm ci
    # Relative base so the bundle works from any EOS sub-directory
    - npm run build -- --base=./
    - mkdir -p public && cp -r dist/* public/
  artifacts:
    paths:
      - public/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "prod"

# Requires masked CI/CD variables EOS_ACCOUNT_USERNAME and EOS_ACCOUNT_PASSWORD
# for an account with write access to the ispy EOS project space.
.deploy-eos:
  stage: deploy
  image: gitlab-registry.cern.ch/ci-tools/ci-web-deployer:latest
  needs: [build]
  variables:
    CI_OUTPUT_DIR: "public/"
    EOS_MGM_URL: "root://eosproject.cern.ch"
    METHOD: "xrdcp"
  script:
    - deploy-eos
  before_script: []
  after_script: []

deploy-dev:
  extends: .deploy-eos
  variables:
    EOS_PATH: "/eos/project/i/ispy/www/ispy-webgl-dev"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

deploy-prod:
  extends: .deploy-eos
  variables:
    EOS_PATH: "/eos/project/i/ispy/www/ispy-webgl"
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
